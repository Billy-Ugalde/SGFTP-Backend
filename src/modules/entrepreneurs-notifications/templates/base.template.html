<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMAIL_TITLE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      line-height: 1.6;
      color: #3D3935;
      background-color: #F6F4EB;
    }

    .email-wrapper {
      background-color: #F6F4EB;
      padding: 32px 16px;
    }

    .email-container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(10, 69, 88, 0.10);
      overflow: hidden;
    }

    .header {
      background: #0A4558;
      padding: 36px 32px;
      text-align: center;
    }

    .header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      color: rgba(246, 244, 235, 0.65);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .header-line {
      width: 40px;
      height: 3px;
      background: #52AC83;
      margin: 14px auto 0;
      border-radius: 2px;
    }

    .content {
      padding: 36px 32px;
      background: #ffffff;
    }

    .greeting {
      font-size: 16px;
      color: #3D3935;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: #eae7df;
      margin: 28px 0;
    }

    .footer-msg {
      font-size: 14px;
      color: #7a7573;
      line-height: 1.7;
    }

    .footer {
      background: #3D3935;
      padding: 28px 32px;
      text-align: center;
    }

    .footer-brand {
      font-weight: 700;
      color: #F6F4EB;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .footer-tagline {
      color: rgba(246, 244, 235, 0.55);
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .footer-contact {
      font-size: 13px;
      margin-bottom: 8px;
    }

    .footer-contact a {
      color: rgba(246, 244, 235, 0.8);
      text-decoration: none;
    }

    .footer-contact span {
      color: rgba(246, 244, 235, 0.8);
    }

    .footer-note {
      color: rgba(246, 244, 235, 0.4);
      font-size: 11px;
      margin-top: 10px;
    }

    @media (max-width: 650px) {
      .email-wrapper { padding: 12px 8px; }
      .header { padding: 28px 20px; }
      .content { padding: 24px 18px; }
      .footer { padding: 22px 18px; }
    }

    CUSTOM_STYLES
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">

      <div class="header">
        <h1>Fundaci&#243;n Tamarindo Park</h1>
        <p>Tu Voz, Nuestro Proyecto</p>
        <div class="header-line"></div>
      </div>

      <div class="content">
        <p class="greeting">Estimado/a <strong>RECIPIENT_NAME</strong>,</p>

        EMAIL_CONTENT

        <div class="divider"></div>

        <p class="footer-msg">FOOTER_MESSAGE</p>
      </div>

      <div class="footer">
        <p class="footer-brand">Fundaci&#243;n Tamarindo Park</p>
        <p class="footer-tagline">Tu Voz, Nuestro Proyecto</p>
        <p class="footer-contact">
          <a href="mailto:info@tamarindoparkfoundation.com">info@tamarindoparkfoundation.com</a>
          &nbsp;&middot;&nbsp;
          <span>+506 6461 2741</span>
        </p>
        <p class="footer-note">Este es un mensaje autom&#225;tico. Por favor no responder a este correo.</p>
      </div>

    </div>
  </div>
</body>
</html>
